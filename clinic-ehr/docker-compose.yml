services:
  ehr:
    build: .
    image: clinic-ehr:0.1
    container_name: clinic-ehr
    restart: unless-stopped
    # The bind-mounted ./data directory is owned by the host user that ran
    # bootstrap.sh; run as that uid instead of root. LAB_UID/LAB_GID are
    # written to samba-dc/.env by scripts/bootstrap.sh.
    user: "${LAB_UID:-1000}:${LAB_GID:-1000}"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    tmpfs:
      - /tmp:size=16m
    environment:
      DATA_DIR: /data
      PORT: "8095"
      MAX_BODY_BYTES: "8192"
      READ_TIMEOUT: "10"
      MAX_CONCURRENCY: "32"
    volumes:
      - ./data:/data
    ports:
      # Loopback by default. Setting LAB_BIND_IP=0.0.0.0 in samba-dc/.env
      # publishes the deliberately-unauthenticated portal to every interface.
      - "${LAB_BIND_IP:-127.0.0.1}:8095:8095"
    healthcheck:
      test:
        - CMD
        - python3
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8095/healthz', timeout=3).read()"
      interval: 15s
      timeout: 5s
      start_period: 10s
      retries: 3
    mem_limit: 128m
    cpus: 0.50
    pids_limit: 128
    networks:
      - mills-lab
networks:
  mills-lab:
    external: true
