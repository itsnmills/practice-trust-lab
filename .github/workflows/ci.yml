name: CI

# Action pinning policy: first-party actions use major-version tags and are
# updated by Dependabot (.github/dependabot.yml). Container images used for
# linters are pinned by release tag. Switch to full commit SHAs if the repo
# ever gains outside contributors with write access to workflows.
on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: ruff check
        run: uv run --no-project --with ruff ruff check --output-format=github .
      - name: ruff format --check (advisory until the formatting pass lands)
        # The repo was not ruff-format clean before this gate existed. This step
        # reports the diff without blocking; flip it to blocking once the
        # formatting-only commit is merged.
        continue-on-error: true
        run: uv run --no-project --with ruff ruff format --check .

  tests:
    name: Tests (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install project and dev tools
        run: |
          uv venv --python "${{ matrix.python-version }}"
          uv pip install -e ".[dev]"
      - name: Unit tests
        if: matrix.python-version != '3.12'
        run: .venv/bin/python -m pytest -q
      - name: Unit tests with branch coverage
        if: matrix.python-version == '3.12'
        run: |
          .venv/bin/python -m pytest -q \
            --cov --cov-branch \
            --cov-report=term-missing \
            --cov-report=xml:coverage.xml \
            --cov-report=json:coverage.json
      - name: Write a shields-compatible coverage badge
        if: matrix.python-version == '3.12'
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path

          totals = json.loads(Path("coverage.json").read_text(encoding="utf-8"))["totals"]
          pct = float(totals["percent_covered"])
          color = "brightgreen" if pct >= 90 else "green" if pct >= 80 else "yellow" if pct >= 60 else "orange"
          Path("badges").mkdir(exist_ok=True)
          Path("badges/coverage.json").write_text(
              json.dumps(
                  {
                      "schemaVersion": 1,
                      "label": "coverage",
                      "message": f"{pct:.0f}%",
                      "color": color,
                  }
              )
              + "\n",
              encoding="utf-8",
          )
          print(f"coverage: {pct:.1f}%")
          PY
      - name: Upload coverage report
        if: matrix.python-version == '3.12' && always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            coverage.json
            badges/coverage.json
          if-no-files-found: warn
          retention-days: 14

  typecheck:
    name: Type check (mypy)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install project and dev tools
        run: |
          uv venv --python "3.12"
          uv pip install -e ".[dev]"
      - name: mypy
        # Blocking: the package type-checks cleanly (disallow_untyped_defs; see pyproject.toml).
        run: .venv/bin/python -m mypy

  package:
    name: Package and entry points
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Editable install
        run: |
          uv venv --python "3.12"
          uv pip install -e ".[dev]"
      - name: Console-script entry style
        run: |
          .venv/bin/velari-collect --help >/dev/null
          .venv/bin/velari-render --help >/dev/null
      - name: Legacy script entry style
        run: |
          python3 evidence/collect_practice_evidence.py --help >/dev/null
          python3 evidence/render_practice_snapshot.py --help >/dev/null
      - name: Build sdist and wheel
        run: uv build
      - name: Wheel contents and entry points
        run: |
          python3 - <<'PY'
          import glob
          import zipfile

          wheel = glob.glob("dist/*.whl")[0]
          names = set(zipfile.ZipFile(wheel).namelist())
          required = {
              "practice_evidence/__init__.py",
              "practice_evidence/cli.py",
              "practice_evidence/sections/__init__.py",
              "practice_render/__init__.py",
              "practice_render/render.py",
              "practice_render/assets/packet.css",
              "verify_evidence.py",
              "render_practice_snapshot.py",
          }
          missing = required - names
          assert not missing, f"wheel missing: {sorted(missing)}"
          entry_points = [n for n in names if n.endswith(".dist-info/entry_points.txt")]
          assert entry_points, "wheel has no entry_points.txt"
          entry = zipfile.ZipFile(wheel).read(entry_points[0]).decode()
          for script in ("velari-collect", "velari-render", "velari-verify"):
              assert script in entry, entry
          print(f"wheel ok: {wheel} ({len(names)} files)")
          PY

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: ShellCheck (errors block; warnings are visible in logs)
        # Ubuntu runners ship shellcheck. Existing scripts have warnings
        # (SC2015/SC2034) and one info message (SC1091); errors are the gate.
        run: shellcheck --severity=error scripts/*.sh samba-dc/*.sh endpoint/*.sh

  hadolint:
    name: Hadolint (Dockerfiles)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Hadolint
        # failure-threshold=error: the existing Dockerfiles intentionally use
        # unpinned APT/APK packages (warning-level) for a reproducible demo.
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt hadolint/hadolint:v2.12.0 \
            --failure-threshold error \
            samba-dc/Dockerfile clinic-ehr/Dockerfile endpoint/Dockerfile

  packet:
    name: Render and validate sample packet
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Render the committed sample snapshot
        run: |
          python3 evidence/render_practice_snapshot.py \
            examples/sample-snapshot.json --out /tmp/sample-packet.html
      - name: Validate packet HTML (stdlib only, no network)
        run: |
          python3 - <<'PY'
          import re
          import sys
          from html.parser import HTMLParser
          from pathlib import Path

          VOID = {
              "area", "base", "br", "col", "embed", "hr", "img", "input",
              "link", "meta", "param", "source", "track", "wbr",
          }

          class Checker(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack = []
                  self.problems = []
                  self.external = []

              def handle_starttag(self, tag, attrs):
                  for key, value in attrs:
                      if key in {"src", "href", "action"} and value and re.match(r"^(https?:)?//", value):
                          self.external.append(f"{tag}[{key}]={value}")
                  if tag not in VOID:
                      self.stack.append(tag)

              def handle_endtag(self, tag):
                  if tag in VOID:
                      return
                  if not self.stack:
                      self.problems.append(f"stray </{tag}>")
                  elif self.stack[-1] == tag:
                      self.stack.pop()
                  elif tag in self.stack:
                      while self.stack and self.stack[-1] != tag:
                          self.problems.append(f"unclosed <{self.stack.pop()}> before </{tag}>")
                      if self.stack:
                          self.stack.pop()
                  else:
                      self.problems.append(f"unexpected </{tag}>")

          packet = Path("/tmp/sample-packet.html").read_text(encoding="utf-8")
          checker = Checker()
          checker.feed(packet)
          checker.close()
          checker.problems.extend(f"unclosed <{tag}>" for tag in checker.stack)
          if checker.external:
              checker.problems.append(f"external references: {checker.external}")
          if "<script" in packet.lower():
              checker.problems.append("packet must stay script-free")
          if checker.problems:
              print("packet validation failed:", *checker.problems, sep="\n  ")
              sys.exit(1)
          print(f"packet ok: {len(packet)} bytes, no external refs")
          PY

  compose-config:
    name: Validate compose files
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: docker compose config
        env:
          SAMBA_ADMIN_PASS: ci-not-a-real-secret
          USER_TEMP_PASS: ci-not-a-real-secret
          TECH_PASS: ci-not-a-real-secret
          LAB_BIND_IP: 127.0.0.1
        run: |
          for f in samba-dc clinic-ehr workstation-01 frontdesk-01 msp-jump-01; do
            echo "validating $f/docker-compose.yml"
            docker compose -f "$f/docker-compose.yml" config --quiet
          done
