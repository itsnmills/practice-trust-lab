name: Weekly dependency and test check

# Cheap because the project has zero runtime dependencies: the pip-audit step
# audits the dev toolchain (pytest/ruff/mypy) rather than a shipped dependency
# tree. Weekly catches abandoned or vulnerable dev tools without slowing PRs.
on:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: scheduled-${{ github.workflow }}
  cancel-in-progress: true

jobs:
  tests:
    name: Unit tests (Python 3.12)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install project and dev tools
        run: |
          uv venv --python "3.12"
          uv pip install -e ".[dev]"
      - name: Unit tests
        run: .venv/bin/python -m pytest -q

  audit:
    name: Dependency audit (dev toolchain)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - name: Install project, dev tools, and pip-audit
        run: |
          uv venv --python "3.12"
          uv pip install -e ".[dev]" pip-audit
      - name: pip-audit
        # Runtime dependencies are empty, so this audits the pinned dev
        # toolchain. Freezing and using --no-deps/--disable-pip keeps pip-audit
        # from building a throwaway venv just to resolve already-installed pins.
        run: |
          uv pip freeze --exclude-editable > /tmp/audit-requirements.txt
          .venv/bin/python -m pip_audit \
            -r /tmp/audit-requirements.txt \
            --no-deps --disable-pip --strict --progress-spinner off
