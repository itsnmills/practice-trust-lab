services:
  workstation:
    build: ../endpoint
    image: workstation-01-endpoint:0.1
    container_name: ws-clinical-01
    hostname: workstation-01
    domainname: millslab.internal
    restart: unless-stopped
    # Samba domain join and winbind need the same capabilities as the DC.
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - KILL
    security_opt:
      - no-new-privileges:true
    environment:
      ENDPOINT_NAME: ws-clinical-01
      ENDPOINT_ROLE: Clinical workstation
      SYNC_USER: jchen
      SYNC_SHARES: ClinicalShare
      SYNC_PATTERN: "*.csv"
    secrets:
      - lab_env
    dns:
      - 172.31.13.10
    volumes:
      - ./home:/home/staff
      - ./logs:/var/log/endpoint
      - ws-samba-data:/var/lib/samba
    stop_grace_period: 20s
    mem_limit: 512m
    cpus: 1.0
    pids_limit: 256
    networks:
      mills-lab:
        ipv4_address: 172.31.13.21
volumes:
  ws-samba-data:
secrets:
  # The shared 0600 env file is mounted read-only; it never appears in
  # `docker inspect` because passwords are no longer container environment.
  lab_env:
    file: ../samba-dc/.env
networks:
  mills-lab:
    external: true
