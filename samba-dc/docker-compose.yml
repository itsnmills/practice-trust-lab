services:
  dc:
    build: .
    image: practice-lab-dc:0.1
    container_name: samba-dc
    hostname: dc1
    domainname: millslab.internal
    restart: unless-stopped
    # Samba's AD DC needs more than Docker's default capability set (it
    # chowns its databases, sets ACLs and xattrs, switches uid/gid for
    # session processes, and binds privileged LDAP/Kerberos ports). Everything
    # else is dropped; see docs/LAB-SECURITY.md.
    cap_drop:
      - ALL
    cap_add:
      - SYS_ADMIN
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETUID
      - SETGID
      - NET_BIND_SERVICE
      - KILL
    security_opt:
      - no-new-privileges:true
    environment:
      REALM: MILLSLAB.INTERNAL
      DOMAIN: MILLSLAB
    secrets:
      - lab_env
    volumes:
      - samba-data:/var/lib/samba
      - samba-etc:/etc/samba
      - mills-lab-shares:/srv/samba/shares
    ports:
      # Loopback by default. LAB_BIND_IP=0.0.0.0 publishes LDAP, Kerberos,
      # kpasswd and the global catalog to every interface; bootstrap.sh warns.
      - "${LAB_BIND_IP:-127.0.0.1}:389:389/tcp"
      - "${LAB_BIND_IP:-127.0.0.1}:389:389/udp"
      - "${LAB_BIND_IP:-127.0.0.1}:636:636/tcp"
      - "${LAB_BIND_IP:-127.0.0.1}:88:88/tcp"
      - "${LAB_BIND_IP:-127.0.0.1}:88:88/udp"
      - "${LAB_BIND_IP:-127.0.0.1}:464:464/tcp"
      - "${LAB_BIND_IP:-127.0.0.1}:464:464/udp"
      - "${LAB_BIND_IP:-127.0.0.1}:3268:3268/tcp"
    healthcheck:
      test: ["CMD", "samba-tool", "domain", "info", "127.0.0.1"]
      interval: 20s
      timeout: 10s
      start_period: 90s
      retries: 3
    stop_grace_period: 30s
    mem_limit: 2g
    cpus: 2.0
    pids_limit: 512
    networks:
      mills-lab:
        ipv4_address: 172.31.13.10
secrets:
  # First-run provisioning reads the admin password from this read-only mount
  # instead of an environment variable, so it does not appear in the container
  # config (`docker inspect`). The host file stays mode 0600 and gitignored.
  lab_env:
    file: .env
volumes:
  samba-data:
  samba-etc:
  mills-lab-shares:
    external: true
networks:
  mills-lab:
    external: true
