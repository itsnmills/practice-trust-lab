[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "practice-trust-lab"
version = "0.2.0"
description = "Synthetic small-clinic lab and no-PHI HIPAA-oriented evidence collector (Velari)"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Velari" }]
keywords = ["hipaa", "security", "evidence", "homelab", "synthetic-data"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
]
# Zero runtime dependencies: the collector uses the standard library only.
dependencies = []

[project.optional-dependencies]
dev = [
  "mypy>=1.11",
  "pytest>=8",
  "pytest-cov>=5",
  "ruff>=0.9",
  "tomli>=2; python_version < '3.11'",
]

[project.scripts]
velari-collect = "practice_evidence.cli:main"
velari-render = "render_practice_snapshot:main"
velari-verify = "verify_evidence:main"

[project.urls]
Documentation = "https://github.com/itsnmills/practice-trust-lab/blob/main/docs/ARCHITECTURE.md"
Source = "https://github.com/itsnmills/practice-trust-lab"

[tool.setuptools]
package-dir = { "" = "evidence" }
# The two entry-point scripts predate the package and stay importable as
# top-level modules so `python3 evidence/...` keeps working unchanged.
py-modules = ["hipaa_crosswalk", "render_practice_snapshot", "verify_evidence"]

[tool.setuptools.packages.find]
where = ["evidence"]
include = ["practice_evidence*", "practice_render*"]

[tool.setuptools.package-data]
# The packet stylesheet is read from the installed package at render time.
practice_render = ["assets/*.css"]
# The snapshot JSON Schema is loaded at runtime by the validate-before-write step.
practice_evidence = ["data/*.json"]

# --- lint / format -----------------------------------------------------------------
[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]  # long lines live in the HTML template strings

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# --- typing ------------------------------------------------------------------------
[tool.mypy]
python_version = "3.10"
files = ["evidence/practice_evidence"]
show_error_codes = true
pretty = true
# Strict enough to catch real defects in the collector package without
# demanding annotations from the renderer's HTML template helpers.
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_return_any = true
warn_unused_configs = true
strict_equality = true

# --- tests / coverage --------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "heavy: needs the Docker lab; excluded from the default unit-test run",
]

[tool.coverage.run]
branch = true
source = ["evidence"]
# Thin script wrapper and generated evidence are not meaningfully coverable.
omit = [
  "evidence/collect_practice_evidence.py",
  "evidence/artifacts/*",
]
relative_files = true

[tool.coverage.report]
show_missing = true
skip_covered = true
# Measured at 82% (branch) on 2026-11-12 with the whole unit + e2e suite.
# Kept ~5 points under the measurement so new in-flight modules do not turn the
# build red the moment they land. Raise it as coverage improves; never lower it
# to make a red build green.
fail_under = 75
exclude_lines = [
  "pragma: no cover",
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
  "raise NotImplementedError",
]

[tool.coverage.json]
output = "coverage.json"
