[global]
   workgroup = MILLSLAB
   realm = MILLSLAB.INTERNAL
   server role = active directory domain controller
   server services = s3fs, rpc, nbt, wrepl, ldap, cldap, kdc, drepl, winbindd, ntp_signd, kcc, dnsupdate
   netbios name = DC1
   log level = 3 auth_audit:3
   server signing = mandatory
   ldap server require strong auth = yes
   ntlm auth = ntlmv2-only
   server min protocol = SMB2_02
   idmap_ldb:use rfc2307 = yes

[sysvol]
   path = /var/lib/samba/sysvol
   read only = No
   browseable = No

[netlogon]
   path = /var/lib/samba/sysvol/millslab.internal/scripts
   read only = No
   browseable = No

[ClinicalShare]
   path = /srv/samba/shares/clinical
   read only = No
   browseable = Yes
   valid users = @DL-ClinicalShare-RW
   force group = DL-ClinicalShare-RW
   create mask = 0660
   directory mask = 0770

[FrontOfficeShare]
   path = /srv/samba/shares/frontoffice
   read only = No
   browseable = Yes
   valid users = @SG-FrontOffice @SG-IT
   force group = SG-FrontOffice
   create mask = 0660
   directory mask = 0770

[ITShare]
   path = /srv/samba/shares/it
   read only = No
   browseable = Yes
   valid users = @SG-IT
   force group = SG-IT
   create mask = 0660
   directory mask = 0770
